<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" role="img" aria-label="Shoptify Winter Reverser Engine architecture">
  <defs>
    <pattern id="gridArchS" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.45"/>
    </pattern>
    <marker id="sArrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1793d1"/>
    </marker>
    <marker id="sArrE" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#39d353"/>
    </marker>
    <marker id="sArrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e3b341"/>
    </marker>
  </defs>

  <rect width="880" height="260" rx="12" fill="#090d16"/>
  <rect width="880" height="260" rx="12" fill="url(#gridArchS)"/>
  <rect x="0.75" y="0.75" width="878.5" height="258.5" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <text x="24" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="0.8">ARCHITECTURE // CAPTURE, MIRROR, REPLAY &amp; DESIGN VAULT PIPELINE</text>
  <line x1="24" y1="38" x2="856" y2="38" stroke="#1e293b" stroke-width="1"/>

  <!-- Stage 1: Capture & Inventory -->
  <g transform="translate(24, 54)">
    <text x="0" y="12" font-family="ui-monospace, monospace" font-size="10" fill="#1793d1">01. EXTRACT &amp; INVENTORY</text>
    <rect x="0" y="22" width="186" height="162" rx="8" fill="#111622" stroke="#1793d1" stroke-width="1.2"/>

    <text x="12" y="42" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#f8fafc">scripts/</text>
    <text x="12" y="57" font-family="ui-monospace, monospace" font-size="9.5" fill="#94a3b8">extract_page.py / .js</text>
    <text x="12" y="71" font-family="ui-monospace, monospace" font-size="9.5" fill="#94a3b8">build_inventory.py</text>
    <text x="12" y="85" font-family="ui-monospace, monospace" font-size="9.5" fill="#94a3b8">capture_assets.py</text>

    <line x1="12" y1="98" x2="174" y2="98" stroke="#1e293b"/>
    <text x="12" y="116" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#39d353">snapshot/</text>
    <text x="12" y="131" font-family="ui-monospace, monospace" font-size="9.5" fill="#cbd5e1">inventory.json</text>
    <text x="12" y="145" font-family="ui-monospace, monospace" font-size="9.5" fill="#cbd5e1">page-content.json (12)</text>
    <text x="12" y="159" font-family="ui-monospace, monospace" font-size="9.5" fill="#cbd5e1">page.ssr.html + shots</text>
  </g>

  <path d="M 210 135 L 242 135" fill="none" stroke="#1793d1" stroke-width="1.5" marker-end="url(#sArrC)"/>

  <!-- Stage 2: Captured Assets & Vendor -->
  <g transform="translate(246, 54)">
    <text x="0" y="12" font-family="ui-monospace, monospace" font-size="10" fill="#39d353">02. LOCAL ASSET STORE</text>
    <rect x="0" y="22" width="196" height="162" rx="8" fill="#111622" stroke="#39d353" stroke-width="1.2"/>

    <text x="12" y="42" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#f8fafc">assets/</text>
    <text x="12" y="58" font-family="ui-monospace, monospace" font-size="9.5" fill="#cbd5e1">images/ (577) · video/</text>
    <text x="12" y="72" font-family="ui-monospace, monospace" font-size="9.5" fill="#cbd5e1">3d/ (55 .glb/.usdz)</text>
    <text x="12" y="86" font-family="ui-monospace, monospace" font-size="9.5" fill="#cbd5e1">data/ (16 Theatre JSON)</text>
    <text x="12" y="100" font-family="ui-monospace, monospace" font-size="9.5" fill="#cbd5e1">fonts/ (11) · rive/ · css/</text>

    <line x1="12" y1="112" x2="184" y2="112" stroke="#1e293b"/>
    <text x="12" y="130" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#e3b341">vendor/</text>
    <text x="12" y="145" font-family="ui-monospace, monospace" font-size="9.5" fill="#94a3b8">@rive-app/webgl2@2.37.2</text>
    <text x="12" y="159" font-family="ui-monospace, monospace" font-size="9.5" fill="#94a3b8">three@0.169.0 &amp; 0.172.0</text>
  </g>

  <path d="M 442 104 L 478 88" fill="none" stroke="#1793d1" stroke-width="1.5" marker-end="url(#sArrC)"/>
  <path d="M 442 135 L 478 135" fill="none" stroke="#39d353" stroke-width="1.5" marker-end="url(#sArrE)"/>
  <path d="M 442 168 L 478 184" fill="none" stroke="#e3b341" stroke-width="1.5" marker-end="url(#sArrG)"/>

  <!-- Stage 3: Outputs (Mirror, Site Vault, Distilled Src & Docs) -->
  <g transform="translate(482, 54)">
    <text x="0" y="12" font-family="ui-monospace, monospace" font-size="10" fill="#e3b341">03. OUTPUT TARGETS</text>

    <rect x="0" y="22" width="180" height="50" rx="6" fill="#111622" stroke="#1793d1" stroke-width="1.1"/>
    <text x="10" y="39" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#f8fafc">mirror/ (:4174)</text>
    <text x="10" y="54" font-family="ui-sans-serif, sans-serif" font-size="9.5" fill="#94a3b8">serve_mirror.py · qa_mirror.py</text>

    <rect x="0" y="78" width="180" height="50" rx="6" fill="#111622" stroke="#39d353" stroke-width="1.1"/>
    <text x="10" y="95" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#f8fafc">site/ (:4173)</text>
    <text x="10" y="110" font-family="ui-sans-serif, sans-serif" font-size="9.5" fill="#94a3b8">Vault reader + site/replay/</text>

    <rect x="0" y="134" width="180" height="50" rx="6" fill="#111622" stroke="#e3b341" stroke-width="1.1"/>
    <text x="10" y="151" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#f8fafc">src/ + docs/</text>
    <text x="10" y="166" font-family="ui-sans-serif, sans-serif" font-size="9.5" fill="#94a3b8">Tokens, components, 01..06 md</text>
  </g>

  <!-- Stage 4: QA & Visual Diff -->
  <g transform="translate(682, 54)">
    <text x="0" y="12" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">04. VERIFICATION</text>
    <rect x="0" y="22" width="174" height="162" rx="8" fill="#111622" stroke="#1e293b" stroke-width="1.2"/>
    <text x="12" y="44" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#f8fafc">visual_compare.py</text>
    <text x="12" y="60" font-family="ui-sans-serif, sans-serif" font-size="9.5" fill="#94a3b8">Pillow frame diff against</text>
    <text x="12" y="73" font-family="ui-sans-serif, sans-serif" font-size="9.5" fill="#94a3b8">reference PNG captures</text>
    <line x1="12" y1="88" x2="162" y2="88" stroke="#1e293b"/>
    <text x="12" y="106" font-family="ui-monospace, monospace" font-size="9.5" fill="#39d353">capture_shots.sh</text>
    <text x="12" y="121" font-family="ui-monospace, monospace" font-size="9.5" fill="#cbd5e1">00-hero .. 12-developer</text>
    <text x="12" y="136" font-family="ui-monospace, monospace" font-size="9.5" fill="#cbd5e1">vault-*.png · qa-*.png</text>
    <rect x="12" y="152" width="150" height="22" rx="4" fill="#090d16" stroke="#1e293b"/>
    <text x="20" y="166.5" font-family="ui-monospace, monospace" font-size="9" fill="#e3b341">build_docs.py -&gt; docs/</text>
  </g>

  <path d="M 662 103 L 682 103" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="3 2"/>
</svg>
